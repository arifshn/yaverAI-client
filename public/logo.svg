<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Vibrant Gradients -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Y / Pen Symbol -->
  <g transform="translate(100, 50) scale(0.65)" filter="url(#glow)">
      <!-- Left Stroke -->
      <path d="M120 50 C 120 50, 160 250, 240 330" 
            fill="none" stroke="url(#neonGrad)" stroke-width="45" stroke-linecap="round" />
      
      <!-- Right Stroke -->
      <path d="M360 50 C 360 50, 320 250, 240 330 L 240 450" 
            fill="none" stroke="url(#neonGrad)" stroke-width="45" stroke-linecap="round" />
      
      <!-- Pen Nib Detail -->
      <path d="M240 330 L 200 420 L 280 420 Z" fill="#0a0b14" />
      <circle cx="240" cy="380" r="15" fill="url(#neonGrad)" />
      
      <!-- Digital Sparkles -->
      <circle cx="380" cy="100" r="12" fill="#fff" filter="url(#glow)" opacity="0.8" />
      <circle cx="240" cy="0" r="8" fill="#fff" filter="url(#glow)" opacity="0.6" />
  </g>

  <!-- Text: yaverAI -->
  <g transform="translate(0, 420)">
    <text x="50%" y="0" text-anchor="middle" 
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="700" font-size="80" 
          fill="url(#textGrad)" letter-spacing="2">
      yaver<tspan fill="url(#neonGrad)">AI</tspan>
    </text>
  </g>
</svg>
